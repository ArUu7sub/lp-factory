Implement only after reviews/creative-source-review.json is PASS. Own the public root implementation files. Promote the approved deterministic design/prototype into index.html and styles.css, adjusting relative asset paths without changing its layout, copy, palette, type scale, or responsive behavior. Preserve the selected Hero mode exactly: either full-height right-region generated art with left HTML copy, or centered HTML copy over a full-bleed generated background. Preserve the approved desktop/mobile crop or `<picture>` asset switch. Preserve the Hero structure as eyebrow + phrase-aware H1 + `<h2 class="hero-subheading" data-hero-subheading>` + CTA only. Do not add a long Hero description, and do not change the approved copy to solve layout. Verify the displayed character maxima excluding whitespace and line breaks: eyebrow 22, H1 32, H2 44. Use the generated `final-cta` background and every approved section asset. Never replace generated pictorial assets with CSS drawings, gradients, emoji, or code-built illustration. Keep every heading, paragraph, label, button, and CTA as HTML text above an appropriate contrast overlay. Preserve phrase spans and balanced/pretty wrapping rules so Japanese meaning units remain intact at 360px through 1440px. Preserve the shared header exactly and keep it sticky at the top. Preserve the shared footer with the same brand and three header anchors, no back-to-top link, and left-aligned vertical mobile layout. Do not introduce a Hero overview when the approved design omitted it to avoid duplication. If a distinct Hero overview is present, render every numbered stage with its short action/outcome along one continuous connected route, horizontal on desktop and left-aligned vertical on mobile. Preserve separate mapped desktop/mobile workflow assets and keep every label and handoff statement as HTML. Keep workflow action text at 18px or larger on both desktop and mobile, maintain at least 4.5:1 contrast for numbers and text, and allocate enough width to prevent orphaned final characters. Add only the minimal script.js and content.json required by the public contract. Keep the six fixed sections in order, semantic HTML, local relative assets, visible focus, adequate contrast, and responsive behavior from 360px through 1440px. Keep LINE URL empty, mark each LINE link data-line-cta, disable it silently, and do not render preparation-state copy. The runner captures screenshots after this sandboxed stage; do not launch a browser, install packages, or create implementation/screenshots yourself. If a required image is missing, record it and return it to lp-imagegen-designer. You are not alone in the workspace; preserve other agents' files.
